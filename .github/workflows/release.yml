name: Publier une Release Foundry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de Release, par exemple v0.1.0"
        required: true
        default: "v0.1.2"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Contrôler et produire le ZIP
        run: npm run package
      - name: Vérifier le tag
        run: node tools/validate-release-tag.mjs "$RELEASE_TAG"
      - name: Créer ou actualiser la Release
        shell: bash
        run: |
          ASSET="build/relis-${RELEASE_TAG}.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET" --target main --generate-notes --title "$RELEASE_TAG"
          fi
